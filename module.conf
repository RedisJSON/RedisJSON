############################## JSON ENGINE CONFIG ############################

# Allow JSON write commands to create the missing object levels of a path,
# instead of failing. Applies to JSON.SET, JSON.MSET, JSON.MERGE,
# JSON.ARRAPPEND, JSON.ARRINSERT, JSON.NUMINCRBY and JSON.STRAPPEND.
# For example, with this enabled, `JSON.SET k $.a.b.c 5` creates `a` and `b`.
# Only missing *object* keys are created; missing array indexes are not.
# yes/no, default: no
# This is a load-time configuration parameter.
#
# IMPORTANT: set the same value on every node of a shard. Writes replicate
# verbatim, so a primary with this enabled and a replica with it disabled will
# silently diverge.
# Use the same value when replaying or restoring an AOF: commands recorded with
# this enabled may fail to recreate their data when it is disabled during replay.
#
# json-auto-create-deep-paths no

# Enforce a maximum nesting depth of 128 when loading JSON from RDB.
# Enabling this protects against excessive-nesting stack exhaustion.
# Over-limit documents cause RESTORE to return an error.
# During startup or replica full sync, an over-limit document causes RDB
# loading to fail; the key is not skipped. This can prevent startup or
# completion of replica synchronization.
# yes/no, default: no
#
# json-legacy-rdb-depth-limit no

# >>> BEGIN redis-gen-conf:private <<<
# Internal/advanced RedisJSON tunables — intentionally NOT exported to
# redis-gen.conf by `make sync-redis-conf`. Set via CLI override or by
# editing this module.conf directly when running redis-server against it.
# Marker contract is parsed by redis-core's `scripts/sync-redis-conf.sh`
# (constants PRIVATE_BEGIN / PRIVATE_END, exact-string match).

# Ceiling, in bytes, on the memory the RDB writer uses to share strings between
# JSON values: each string that several values share is written once, where it is
# first used, and as a short id afterwards. Past the ceiling, strings not yet shared
# are written inline, so the RDB grows back toward its size without sharing but never
# fails and never exceeds it by more than a few bytes per value.
# 0 turns the writer off (an RDB written without sharing; reading is unaffected).
# Memory units are accepted. Range: 0 to 1tb. Default: 256mb.
# Changeable at runtime; a BGSAVE child keeps the value it inherited at fork.
# After a table-budget miss, the next resident value reuses the cleared table.
# Definitions in later values can therefore share strings again within the same ceiling.
#
# json-rdb-dictionary-max-bytes 256mb

# Most bytes of strings that one RDB stream defines; 0 sets no bound. A server that loads the
# stream keeps every defined string in RAM until the stream ends, even when Flex spills the
# values that hold them, so this is also what a stream pins in a reader. Past it a string is
# written in full, and the strings defined so far keep being referenced.
# Memory units are accepted. Range: 0 to 1tb. Default: 0.
# Changeable at runtime; a BGSAVE child keeps the value it inherited at fork.
#
# This caps UTF-8 payload bytes, not total reader RAM; allow for allocation and Flex overhead.
# Dictionary resets release earlier reader handles, but do not replenish this allowance.
# Redefining a string after a reset counts its bytes again.
# json-rdb-dictionary-max-def-bytes 0
# <<< END redis-gen-conf:private <<<
