############################## JSON ENGINE CONFIG ############################

# Allow JSON write commands to create the missing object levels of a path,
# instead of failing. Applies to JSON.SET, JSON.MSET, JSON.MERGE,
# JSON.ARRAPPEND, JSON.ARRINSERT, JSON.NUMINCRBY and JSON.STRAPPEND.
# For example, with this enabled, `JSON.SET k $.a.b.c 5` creates `a` and `b`.
# Only missing *object* keys are created; missing array indexes are not.
# yes/no, default: no
# This is a load-time configuration parameter.
#
# IMPORTANT: set the same value on every node of a shard. Writes replicate
# verbatim, so a primary with this enabled and a replica with it disabled will
# silently diverge.
# Use the same value when replaying or restoring an AOF: commands recorded with
# this enabled may fail to recreate their data when it is disabled during replay.
#
# json-auto-create-deep-paths no

# Enforce a maximum nesting depth of 128 when loading JSON from RDB.
# Enabling this protects against excessive-nesting stack exhaustion.
# Over-limit documents cause RESTORE to return an error.
# During startup or replica full sync, an over-limit document causes RDB
# loading to fail; the key is not skipped. This can prevent startup or
# completion of replica synchronization.
# yes/no, default: no
#
# json-legacy-rdb-depth-limit no

