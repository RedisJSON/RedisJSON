version: 0.2
name: "json_mset_auto_create_deep_paths"
description: "JSON.MSET of $.a.b.c.d on two mostly new random keys per request, creating the missing object chains."

dbconfig:
  - module-configuration-parameters:
      rejson:
        json-auto-create-deep-paths: "yes"
clientconfig:
  - tool: redis-benchmark
  - min-tool-version: "6.2.0"
  - parameters:
    - clients: 16
    - requests: 5000000
    - threads: 2
    - pipeline: 1
    # Keep random-key reuse rare so requests mostly create documents.
    - keyspacelen: 1000000000
    - command: 'JSON.MSET auto-create:a:__rand_int__ $.a.b.c.d 1 auto-create:b:__rand_int__ $.a.b.c.d 2'
