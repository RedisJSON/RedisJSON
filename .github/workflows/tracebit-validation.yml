name: Tracebit container validation
on:
  pull_request:
    paths:
      - '.github/**'
      - 'sbin/upload-artifacts-s3'
  push:
    branches: [master]
    paths:
      - '.github/**'
      - 'sbin/upload-artifacts-s3'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure Tracebit canary credentials
        if: github.repository == 'RedisJSON/RedisJSON'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ github.repository == 'RedisJSON/RedisJSON' && secrets.SECURITY_API_TOKEN || '' }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Offline isolation and argument tests
        run: python3 .github/scripts/test_tracebit_container.py
      - name: BuildKit image and cache isolation with inert fixtures
        run: python3 .github/scripts/test_tracebit_buildkit.py
