name: Release Drafter

on:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - master

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "master"
      - name: Configure Tracebit canary credentials
        if: github.repository == 'RedisJSON/RedisJSON'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ github.repository == 'RedisJSON/RedisJSON' && secrets.SECURITY_API_TOKEN || '' }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - uses: release-drafter/release-drafter@v7
        with:
          # (Optional) specify config name to use, relative to .github/. Default: release-drafter.yml
           config-name: release-drafter-config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
