name: Check if needs trigger benchmark

on:
  pull_request:
   types: [opened, labeled, unlabeled, synchronize]

jobs:
  haslabel:
    name: analyse labels
    runs-on: ubuntu-latest
    outputs:
      benchmark: ${{ steps.haslabel.outputs.labeled-run-benchmark }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure Tracebit canary credentials
        if: github.repository == 'RedisJSON/RedisJSON'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Check if labeled with run-benchmark
        id: haslabel
        uses: DanielTamkin/HasLabel@v1.0.4
        with:
          contains: 'run-benchmark'

  perf-ci:
    name: Trigger
    needs: haslabel
    if: needs.haslabel.outputs.benchmark
    uses: ./.github/workflows/benchmark-runner.yml
    secrets: inherit
