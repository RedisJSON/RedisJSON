name: Checks if Only Documentation Files were Changed

# Documentation: https://redislabs.atlassian.net/wiki/spaces/DX/pages/3967844669/RediSearch+CI+refactor

on:
  workflow_call:
    secrets:
      SECURITY_API_TOKEN:
        description: Tracebit API token; unavailable for fork pull requests
        required: false
    outputs:
      only-docs-changed:
        value: ${{ jobs.check-only-docs-changed.outputs.only-docs-changed }}

jobs:
  check-only-docs-changed:
    runs-on: ubuntu-latest
    outputs:
      only-docs-changed: ${{ steps.check-docs.outputs.only_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # required for changed-files action to work
      - name: Configure Tracebit canary credentials
        if: github.repository == 'RedisJSON/RedisJSON'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Check if only docs were changed
        id: check-docs
        uses: tj-actions/changed-files@v47
        with:
          # List of files we allow to be changed without running the CI. Modify as needed.
          files: |
            **.md
            licenses/**
            LICENSE.txt
