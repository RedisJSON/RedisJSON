name: JSONPath Performance Check

on:
  workflow_call:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test regression gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_jsonpath_benchmark_gate.py'

      - name: Select toolchain and cache key
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark-results
          python3 - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, '.github/scripts')
          from jsonpath_benchmark_gate import master_baseline_key

          toolchain = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          lock = tomllib.loads(Path('Cargo.lock').read_text())
          criterion = next(package['version'] for package in lock['package'] if package['name'] == 'criterion')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RUSTUP_TOOLCHAIN={toolchain}\n')
          prefix = f"jsonpath-baseline-v1-ubuntu-24.04-{os.environ['RUNNER_ARCH']}-"
          baseline = master_baseline_key(os.environ['GITHUB_REPOSITORY'], prefix, criterion)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'cache-prefix={prefix}master-{criterion}\n')
              output.write(f'baseline-key={baseline}\n')
          PY

      - name: Restore saved measurements
        id: baseline
        if: steps.setup.outputs.baseline-key != ''
        uses: actions/cache/restore@v4
        with:
          path: benchmark-baseline
          key: ${{ steps.setup.outputs.baseline-key }}

      - name: Prepare comparison
        id: comparison
        env:
          CACHE_KEY: ${{ steps.baseline.outputs.cache-matched-key }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path('benchmark-baseline')
          results = Path('benchmark-results')
          baseline_sha = None
          if os.environ['CACHE_KEY']:
              data = json.loads((source / 'comparison.json').read_text())
              entries = data['entries']['JSONPath']
              if len(entries) != 1:
                  raise ValueError('Saved baseline must contain one measurement run')
              baseline_sha = entries[0]['commit']['id']
          compare = baseline_sha is not None and baseline_sha != os.environ['CANDIDATE_SHA']
          if compare:
              # The action otherwise labels the baseline with the PR head, ignoring ref.
              shutil.copyfile(source / 'comparison.json', results / 'comparison.json')
              shutil.copytree(source / 'criterion', results / 'criterion')
              if (source / 'environment.txt').exists():
                  shutil.copyfile(source / 'environment.txt', results / 'baseline-environment.txt')
              message = f'Saved master baseline: {baseline_sha}\nCache: {os.environ["CACHE_KEY"]}'
          else:
              message = 'No saved master baseline from another commit; reporting measurements without comparison.'
          text = f'## JSONPath performance\nCandidate: {os.environ["CANDIDATE_SHA"]}\n{message}\n'
          (results / 'commits.txt').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(text)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'available={str(compare).lower()}\n')
              output.write(f'baseline-sha={baseline_sha or ""}\n')
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libssl-dev pkg-config
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Record benchmark environment
        run: |
          {
            uname -a
            lscpu
            rustc -Vv
          } | tee benchmark-results/environment.txt

      - name: Build benchmark binary
        # This replaces the previous baseline rebuild, whose constraint was:
        # Only the benchmark harness and its dev dependency change on the baseline.
        run: |
          cargo bench -p json_path --bench path_performance --locked --no-run

      - name: Measure candidate and save Criterion baseline
        env:
          CRITERION_HOME: ${{ github.workspace }}/benchmark-results/criterion
          JSONPATH_BENCHMARK_PATHS: ${{ github.workspace }}/benchmark-results/paths.jsonl
        run: |
          : > "$JSONPATH_BENCHMARK_PATHS"
          cargo bench -p json_path --bench path_performance --locked -- \
            --save-baseline saved --output-format bencher | tee benchmark-results/candidate.txt

      - name: Report changes
        id: measurements
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: JSONPath
          tool: cargo
          output-file-path: benchmark-results/candidate.txt
          external-data-json-path: benchmark-results/comparison.json
          github-token: ${{ github.token }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          summary-always: false
          fail-on-alert: false

      - name: Select workloads for confirmation
        id: regressions
        if: steps.comparison.outputs.available == 'true'
        run: python3 .github/scripts/jsonpath_benchmark_gate.py benchmark-results/comparison.json

      - name: Check out saved master for confirmation
        if: steps.regressions.outputs.filter != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.comparison.outputs.baseline-sha }}
          path: benchmark-master
          persist-credentials: false

      - name: Measure flagged master workloads on this runner
        if: steps.regressions.outputs.filter != ''
        env:
          BENCHMARK_FILTER: ${{ steps.regressions.outputs.filter }}
          CRITERION_HOME: ${{ github.workspace }}/benchmark-results/confirmation/criterion
          CARGO_TARGET_DIR: ${{ github.workspace }}/benchmark-master-target
        run: |
          mkdir -p benchmark-results/confirmation
          cp json_path/benches/path_performance.rs benchmark-master/json_path/benches/path_performance.rs
          cd benchmark-master
          cargo bench -p json_path --bench path_performance --locked -- \
            --save-baseline master --output-format bencher "$BENCHMARK_FILTER" \
            | tee ../benchmark-results/confirmation/master.txt

      - name: Record fresh master measurements
        if: steps.regressions.outputs.filter != ''
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: JSONPath
          tool: cargo
          output-file-path: benchmark-results/confirmation/master.txt
          external-data-json-path: benchmark-results/confirmation/comparison.json
          github-token: ${{ github.token }}
          ref: ${{ steps.comparison.outputs.baseline-sha }}
          summary-always: false
          fail-on-alert: false

      - name: Label confirmation baseline with saved master commit
        if: steps.regressions.outputs.filter != ''
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('benchmark-results/comparison.json').read_text())
          target = Path('benchmark-results/confirmation/comparison.json')
          data = json.loads(target.read_text())
          entries = data['entries']['JSONPath']
          if len(entries) != 1:
              raise ValueError('Expected one fresh master measurement run')
          entries[0]['commit'] = source['entries']['JSONPath'][0]['commit']
          target.write_text(json.dumps(data))
          PY

      - name: Rerun flagged candidate workloads on this runner
        if: steps.regressions.outputs.filter != ''
        env:
          BENCHMARK_FILTER: ${{ steps.regressions.outputs.filter }}
          CRITERION_HOME: ${{ github.workspace }}/benchmark-results/confirmation/criterion
        run: |
          cargo bench -p json_path --bench path_performance --locked -- \
            --baseline master --output-format bencher "$BENCHMARK_FILTER" \
            | tee benchmark-results/confirmation/candidate.txt

      - name: Report confirmation
        id: confirmation
        if: steps.regressions.outputs.filter != ''
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: JSONPath
          tool: cargo
          output-file-path: benchmark-results/confirmation/candidate.txt
          external-data-json-path: benchmark-results/confirmation/comparison.json
          github-token: ${{ github.token }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          summary-always: false
          fail-on-alert: false

      - name: Fail confirmed regressions
        if: steps.regressions.outputs.filter != ''
        run: |
          python3 .github/scripts/jsonpath_benchmark_gate.py benchmark-results/comparison.json \
            --confirmation benchmark-results/confirmation/comparison.json

      - name: Write benchmark job summary
        if: always() && steps.measurements.outcome == 'success'
        env:
          CONFIRMATION_AVAILABLE: ${{ steps.confirmation.outcome == 'success' }}
        run: |
          confirmation=()
          if [[ "$CONFIRMATION_AVAILABLE" == 'true' ]]; then
            confirmation=(--confirmation benchmark-results/confirmation/comparison.json)
          fi
          python3 .github/scripts/jsonpath_benchmark_gate.py benchmark-results/comparison.json \
            --summary --paths-file benchmark-results/paths.jsonl "${confirmation[@]}" \
            | tee benchmark-results/summary.md

      - name: Prepare measurements for future runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source = Path('benchmark-results')
          target = Path('benchmark-baseline')
          target.mkdir(exist_ok=True)
          data = json.loads((source / 'comparison.json').read_text())
          data['entries']['JSONPath'] = data['entries']['JSONPath'][-1:]
          (target / 'comparison.json').write_text(json.dumps(data))
          shutil.copyfile(source / 'environment.txt', target / 'environment.txt')
          if (target / 'criterion').exists():
              shutil.rmtree(target / 'criterion')
          shutil.copytree(source / 'criterion', target / 'criterion')
          PY

      - name: Save measurements for future runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: benchmark-baseline
          key: ${{ steps.setup.outputs.cache-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload measurements and HTML reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jsonpath-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results/
          retention-days: 30
