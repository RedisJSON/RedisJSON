name: JSONPath Performance Check

on:
  workflow_call:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test regression gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_jsonpath_benchmark_gate.py'

      - name: Check out master baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.event.before || 'master' }}
          path: benchmark-master
          persist-credentials: false

      - name: Select toolchain and record revisions
        id: comparison
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p benchmark-results
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          toolchain = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RUSTUP_TOOLCHAIN={toolchain}\n')
          def master_field(format):
              return subprocess.check_output(
                  ['git', '-C', 'benchmark-master', 'show', '-s', f'--format={format}', 'HEAD'],
                  text=True,
              ).strip()
          sha = master_field('%H')
          if sha == os.environ['CANDIDATE_SHA']:
              raise ValueError('Master baseline and candidate commits must differ')
          commit = {
              'id': sha,
              'message': master_field('%B'),
              'timestamp': master_field('%cI'),
              'url': f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/commit/{sha}',
              'author': {'name': master_field('%an'), 'email': master_field('%ae')},
          }
          results = Path('benchmark-results')
          (results / 'master-commit.json').write_text(json.dumps(commit))
          text = (f'## JSONPath performance\nCandidate: {os.environ["CANDIDATE_SHA"]}\n'
                  f'Master baseline: {sha}\nBoth revisions measured in this job; no cached timings.\n')
          (results / 'commits.txt').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(text)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'baseline-sha={sha}\n')
          PYTHON

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libssl-dev pkg-config
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Record benchmark environment
        run: |
          {
            uname -a
            lscpu
            rustc -Vv
          } | tee benchmark-results/environment.txt

      - name: Build benchmarks and select shared workloads
        id: workloads
        # This replaces the previous baseline rebuild, whose constraint was:
        # Only the benchmark harness and its dev dependency change on the baseline.
        # Both measurements now use the candidate harness with each revision's dependencies.
        run: |
          cargo bench -p json_path --bench path_performance --locked -- --list --format terse \
            > benchmark-results/candidate-list.txt
          cargo bench -p json_path --bench path_performance --locked --no-run --message-format=json \
            > benchmark-results/candidate-build.jsonl
          (
            cd benchmark-master
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/benchmark-master-target" \
              cargo bench -p json_path --bench path_performance --locked -- --list --format terse \
              > ../benchmark-results/master-list.txt
          )
          python3 - <<'PYTHON'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, '.github/scripts')
          from jsonpath_benchmark_gate import shared_workload_filter

          results = Path('benchmark-results')
          pattern = shared_workload_filter(results / 'master-list.txt', results / 'candidate-list.txt')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'filter={pattern}\n')
          PYTHON
          cp json_path/benches/path_performance.rs benchmark-master/json_path/benches/path_performance.rs
          cd benchmark-master
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/benchmark-master-target" \
            cargo bench -p json_path --bench path_performance --locked --no-run --message-format=json \
            > ../benchmark-results/master-build.jsonl

      - name: Diagnose native timing drift and run order
        run: |
          python3 .github/scripts/jsonpath_benchmark_diagnostics.py \
            benchmark-results/master-build.jsonl benchmark-results/candidate-build.jsonl \
            benchmark-results/diagnostics

      - name: Upload native timing diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: jsonpath-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-results/diagnostics/
            benchmark-results/commits.txt
            benchmark-results/environment.txt
          retention-days: 30

      - name: Measure master on this runner
        env:
          BENCHMARK_FILTER: ${{ steps.workloads.outputs.filter }}
          CRITERION_HOME: ${{ github.workspace }}/benchmark-results/criterion
          CARGO_TARGET_DIR: ${{ github.workspace }}/benchmark-master-target
        run: |
          cd benchmark-master
          cargo bench -p json_path --bench path_performance --locked -- \
            --save-baseline master --output-format bencher "$BENCHMARK_FILTER" \
            | tee ../benchmark-results/master.txt

      - name: Record master measurements
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: JSONPath
          tool: cargo
          output-file-path: benchmark-results/master.txt
          external-data-json-path: benchmark-results/comparison.json
          github-token: ${{ github.token }}
          ref: ${{ steps.comparison.outputs.baseline-sha }}
          summary-always: false
          fail-on-alert: false

      - name: Label baseline with master commit
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          target = Path('benchmark-results/comparison.json')
          data = json.loads(target.read_text())
          entries = data['entries']['JSONPath']
          if len(entries) != 1:
              raise ValueError('Expected one master measurement run')
          # The action otherwise labels the baseline with the PR head, ignoring ref.
          entries[0]['commit'] = json.loads(Path('benchmark-results/master-commit.json').read_text())
          target.write_text(json.dumps(data))
          PYTHON

      - name: Measure candidate against fresh master baseline
        env:
          CRITERION_HOME: ${{ github.workspace }}/benchmark-results/criterion
          JSONPATH_BENCHMARK_PATHS: ${{ github.workspace }}/benchmark-results/paths.jsonl
        run: |
          : > "$JSONPATH_BENCHMARK_PATHS"
          cargo bench -p json_path --bench path_performance --locked -- \
            --baseline-lenient master --output-format bencher | tee benchmark-results/candidate.txt

      - name: Report changes
        id: measurements
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: JSONPath
          tool: cargo
          output-file-path: benchmark-results/candidate.txt
          external-data-json-path: benchmark-results/comparison.json
          github-token: ${{ github.token }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          summary-always: false
          fail-on-alert: false

      - name: Select workloads for confirmation
        id: regressions
        run: python3 .github/scripts/jsonpath_benchmark_gate.py benchmark-results/comparison.json

      - name: Measure flagged master workloads on this runner
        if: steps.regressions.outputs.filter != ''
        env:
          BENCHMARK_FILTER: ${{ steps.regressions.outputs.filter }}
          CRITERION_HOME: ${{ github.workspace }}/benchmark-results/confirmation/criterion
          CARGO_TARGET_DIR: ${{ github.workspace }}/benchmark-master-target
        run: |
          mkdir -p benchmark-results/confirmation
          cd benchmark-master
          cargo bench -p json_path --bench path_performance --locked -- \
            --save-baseline master --output-format bencher "$BENCHMARK_FILTER" \
            | tee ../benchmark-results/confirmation/master.txt

      - name: Record fresh master measurements
        if: steps.regressions.outputs.filter != ''
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: JSONPath
          tool: cargo
          output-file-path: benchmark-results/confirmation/master.txt
          external-data-json-path: benchmark-results/confirmation/comparison.json
          github-token: ${{ github.token }}
          ref: ${{ steps.comparison.outputs.baseline-sha }}
          summary-always: false
          fail-on-alert: false

      - name: Label confirmation baseline with master commit
        if: steps.regressions.outputs.filter != ''
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('benchmark-results/comparison.json').read_text())
          target = Path('benchmark-results/confirmation/comparison.json')
          data = json.loads(target.read_text())
          entries = data['entries']['JSONPath']
          if len(entries) != 1:
              raise ValueError('Expected one fresh master measurement run')
          entries[0]['commit'] = source['entries']['JSONPath'][0]['commit']
          target.write_text(json.dumps(data))
          PY

      - name: Rerun flagged candidate workloads on this runner
        if: steps.regressions.outputs.filter != ''
        env:
          BENCHMARK_FILTER: ${{ steps.regressions.outputs.filter }}
          CRITERION_HOME: ${{ github.workspace }}/benchmark-results/confirmation/criterion
        run: |
          cargo bench -p json_path --bench path_performance --locked -- \
            --baseline master --output-format bencher "$BENCHMARK_FILTER" \
            | tee benchmark-results/confirmation/candidate.txt

      - name: Report confirmation
        id: confirmation
        if: steps.regressions.outputs.filter != ''
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: JSONPath
          tool: cargo
          output-file-path: benchmark-results/confirmation/candidate.txt
          external-data-json-path: benchmark-results/confirmation/comparison.json
          github-token: ${{ github.token }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          summary-always: false
          fail-on-alert: false

      - name: Fail confirmed regressions
        if: steps.regressions.outputs.filter != ''
        run: |
          python3 .github/scripts/jsonpath_benchmark_gate.py benchmark-results/comparison.json \
            --confirmation benchmark-results/confirmation/comparison.json

      - name: Write benchmark job summary
        if: always() && steps.measurements.outcome == 'success'
        env:
          CONFIRMATION_AVAILABLE: ${{ steps.confirmation.outcome == 'success' }}
        run: |
          confirmation=()
          if [[ "$CONFIRMATION_AVAILABLE" == 'true' ]]; then
            confirmation=(--confirmation benchmark-results/confirmation/comparison.json)
          fi
          python3 .github/scripts/jsonpath_benchmark_gate.py benchmark-results/comparison.json \
            --summary --paths-file benchmark-results/paths.jsonl "${confirmation[@]}" \
            | tee benchmark-results/summary.md

      - name: Upload measurements and HTML reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jsonpath-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results/
          retention-days: 30
