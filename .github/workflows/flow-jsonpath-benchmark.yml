name: JSONPath Performance Check

on:
  workflow_call:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GUNGRAUN_HOME: ${{ github.workspace }}/benchmark-results/gungraun
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test Gungraun report
        run: python3 -m unittest discover -s .github/scripts -p 'test_jsonpath_benchmark_report.py'

      - name: Check out master baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.event.before || 'master' }}
          path: benchmark-master
          persist-credentials: false

      - name: Select pinned tool versions and record revisions
        run: |
          mkdir -p benchmark-results
          python3 - <<'PYTHON'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          toolchain = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          version = tomllib.loads(Path('json_path/Cargo.toml').read_text())['dev-dependencies']['gungraun']
          if not version.startswith('='):
              raise ValueError('Pin Gungraun exactly so the library and runner versions match')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RUSTUP_TOOLCHAIN={toolchain}\nGUNGRAUN_VERSION={version[1:]}\n')
          candidate = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          baseline = subprocess.check_output(['git', '-C', 'benchmark-master', 'rev-parse', 'HEAD'], text=True).strip()
          revisions = f'Master baseline: {baseline}\n\nCandidate: {candidate}\n\n'
          Path('benchmark-results/commits.txt').write_text(revisions)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(revisions)
          PYTHON

      - name: Install build and benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libssl-dev pkg-config valgrind
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install --locked --version "$GUNGRAUN_VERSION" gungraun-runner

      - name: Prepare identical benchmark harnesses
        run: |
          python3 - <<'PYTHON'
          import re
          import shutil
          from pathlib import Path

          section = re.compile(r'(?ms)^\[dev-dependencies\]\n.*?(?=^\[|\Z)')
          candidate = Path('json_path/Cargo.toml').read_text()
          baseline = Path('benchmark-master/json_path/Cargo.toml')
          development = section.search(candidate).group()
          manifest, count = section.subn(lambda _: development, baseline.read_text())
          if count != 1:
              raise ValueError('Expected one baseline dev-dependencies section')
          baseline.write_text(manifest)
          for name in ('path_performance.rs', 'run_instructions.sh'):
              source = Path('json_path/benches') / name
              shutil.copy2(source, Path('benchmark-master') / source)
          PYTHON
          cargo update --workspace --manifest-path benchmark-master/Cargo.toml
          cp benchmark-master/Cargo.lock benchmark-results/master-Cargo.lock
          cp Cargo.lock benchmark-results/candidate-Cargo.lock

      - name: Record benchmark environment
        run: |
          {
            uname -a
            lscpu
            rustc -Vv
            valgrind --version
            gungraun-runner --version
          } | tee benchmark-results/environment.txt

      - name: Build and validate both benchmark suites
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/benchmark-master-target" \
            bash benchmark-master/json_path/benches/run_instructions.sh --test
          bash json_path/benches/run_instructions.sh --test

      - name: Measure master instruction baseline
        id: baseline
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/benchmark-master-target
          JSONPATH_BENCHMARK_PATHS: ${{ github.workspace }}/benchmark-results/paths.jsonl
        run: |
          : > "$JSONPATH_BENCHMARK_PATHS"
          bash benchmark-master/json_path/benches/run_instructions.sh \
            --save-baseline=master --save-summary=json --output-format=json \
            | tee benchmark-results/master.jsonl
          cp "$JSONPATH_BENCHMARK_PATHS" benchmark-results/master-paths.jsonl

      - name: Compare candidate against master
        id: measurements
        env:
          JSONPATH_BENCHMARK_PATHS: ${{ github.workspace }}/benchmark-results/paths.jsonl
        run: |
          : > "$JSONPATH_BENCHMARK_PATHS"
          set +e
          bash json_path/benches/run_instructions.sh \
            --baseline=master --save-baseline=candidate --callgrind-limits='ir=5%' \
            --regression-fail-fast=false --save-summary=json --output-format=json \
            | tee benchmark-results/results.jsonl
          benchmark_exit=$?
          set -e
          echo "exit-code=$benchmark_exit" >> "$GITHUB_OUTPUT"
          if [[ "$benchmark_exit" != 0 && "$benchmark_exit" != 3 ]]; then
            exit "$benchmark_exit"
          fi

      - name: Write benchmark job summary
        if: always() && steps.baseline.outcome == 'success' && steps.measurements.outcome == 'success'
        run: |
          python3 .github/scripts/jsonpath_benchmark_report.py benchmark-results/results.jsonl \
            --paths-file benchmark-results/paths.jsonl \
            --baseline-file benchmark-results/master.jsonl \
            --baseline-paths-file benchmark-results/master-paths.jsonl \
            | tee benchmark-results/summary.md

      - name: Enforce Gungraun regression result
        if: always() && steps.measurements.outputs.exit-code == '3'
        run: exit 3

      - name: Upload Gungraun measurements and profiles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jsonpath-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-results/
            !benchmark-results/gungraun/bin/
          retention-days: 30
