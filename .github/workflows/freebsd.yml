name: freebsd

on: []

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Configure Tracebit canary credentials
      if: github.repository == 'RedisJSON/RedisJSON'
      uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
      with:
        customer-id: sha5oz2y
        api-token: ${{ secrets.SECURITY_API_TOKEN }}
        profile: administrator
        profile-region: us-east-1
        async: true
    - name: build
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        sync: rsync
        copyback: false
        prepare: pkg install -y bash curl lang/rust devel/llvm-devel
        run: |
          cargo build --all --all-targets --verbose 
          curl https://sh.rustup.rs -sSf > rustup.sh
          sh rustup.sh -y
          . $HOME/.cargo/env
          rustup target add i686-unknown-freebsd
          cargo build --all --all-targets --verbose --target i686-unknown-freebsd
          cargo test --all --all-targets --verbose
          cargo test -p redis_json --features as-library --all-targets --verbose
