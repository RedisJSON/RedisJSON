name: Flow Clippy
on:
  workflow_call: # Allows to run this workflow from another workflow

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Configure Tracebit canary credentials
        if: github.repository == 'RedisJSON/RedisJSON'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ github.repository == 'RedisJSON/RedisJSON' && secrets.SECURITY_API_TOKEN || '' }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install Rust
        working-directory: .install
        run: |
          ./install_script.sh sudo
      - name: Clippy
        run: |
          source "$HOME/.cargo/env"
          cargo clippy --release -- -D warnings -W clippy::panic -W clippy::unimplemented -W clippy::todo
