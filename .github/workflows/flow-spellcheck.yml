name: Spellcheck
on:
  workflow_call: # Allows to run this workflow from another workflow

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure Tracebit canary credentials
        if: github.repository == 'RedisJSON/RedisJSON'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Spellcheck
        uses: rojopolis/spellcheck-github-actions@0.45.0
        with:
          config_path: .github/spellcheck-settings.yml
          task_name: Markdown
