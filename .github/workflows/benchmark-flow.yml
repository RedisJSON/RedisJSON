name: Run a Benchmark Flow

on:
  workflow_call:
    inputs:
      module_path:
        type: string
        default: bin/linux-x64-release/rejson.so
      profile_env:
        type: number # for default of 0
      cluster_env:
        type: string # for default of ""
      benchmark_glob:
        type: string
        default: "*.yml"
      triggering_env:
        type: string
        default: "circleci" # TODO: change to "github-actions" when ready on grafana
      allowed_envs:
        type: string
        default: "oss-standalone"
      allowed_setups:
        type: string
      benchmark_runner_group_member_id:
        type: number
        default: 1
      benchmark_runner_group_total:
        type: number
        default: 1

jobs:
  benchmark-steps:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - run: |
          git init
          git config --global --add safe.directory '*'
          git submodule update --init --recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.PERFORMANCE_EC2_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.PERFORMANCE_EC2_SECRET_KEY }}
          aws-region: ${{ secrets.PERFORMANCE_EC2_REGION }}

      - name: Ensure perf key exists and has correct permissions
        run: |
          # Ensure perf key exists and has correct permissions
          PEM_FILE="/tmp/benchmarks.redislabs.pem"
          if [ ! -f "$PEM_FILE" ]; then
            echo "Private key not found, retrieving from AWS Secrets Manager..."
            aws secretsmanager get-secret-value \
              --secret-id perf-cto-us-east-2 \
              --query SecretString \
              --output text > "$PEM_FILE"
          fi
          chmod 400 "$PEM_FILE"
          ls -la "$PEM_FILE"

      - name: System setup
        run: ./sbin/system-setup.py

      - name: Build RedisJSON
        run: |
          . $HOME/.cargo/env
          make build

      - name: Prepare automation
        run: |
          ./deps/readies/bin/getpy3
          python3 -m pip install -r tests/benchmarks/requirements.txt
          VERSION=0.14.8 ./deps/readies/bin/getterraform



          
      - name: Run CI benchmarks on aws for envs ${{ inputs.allowed_envs }}
        timeout-minutes: 240 # timeout for the step
        working-directory: tests/benchmarks
        # run-remote applies the committed `kpis` floors itself
        # (results_dict_kpi_check), but its exit code cannot say whether a
        # benchmark came in under its floor or never ran at all -- telling those
        # apart meant grepping the log. continue-on-error hands the verdict to
        # the "Check KPI floors" step below, which names each one, writes the
        # breaches out for the nightly analysis to file from, and fails the job
        # on any breach, including a run where nothing measured at all.
        continue-on-error: true
        env:
          # Hard-coded
          PERF_CALLGRAPH_MODE: dwarf
          MAX_PROFILERS: 1
          # Secrets
          AWS_ACCESS_KEY_ID: ${{ secrets.PERFORMANCE_EC2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PERFORMANCE_EC2_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.PERFORMANCE_EC2_REGION }}
          EC2_PRIVATE_PEM: ${{ secrets.PERFORMANCE_EC2_PRIVATE_PEM }}
          # Inputs
          PROFILE: ${{ inputs.profile_env }}
          BENCHMARK_GLOB: ${{ inputs.benchmark_glob }}
          BENCHMARK_RUNNER_GROUP_M_ID: ${{ inputs.benchmark_runner_group_member_id }}
          BENCHMARK_RUNNER_GROUP_TOTAL: ${{ inputs.benchmark_runner_group_total }}
        # NOTE: json_nummultby_num_2 errors on every run (MOD-18654, resolved
        # Won't Do, broken since at least 2026-08-09). It never produced a result,
        # so it has no `kpis` floor either; the check below lists it as ungated
        # instead of failing on it, which is what keeps the job status usable. All
        # other benchmarks still run and still report; run-remote is not given
        # --fail_fast.
        run: redisbench-admin run-remote
              --module_path ../../${{ inputs.module_path }}
              --github_actor ${{ github.triggering_actor }}
              --github_repo ${{ github.event.repository.name }}
              --github_org ${{ github.repository_owner }}
              --required-module ReJSON
              --github_sha ${{ github.sha }}
              --github_branch ${{ github.head_ref || github.ref_name }}
              --upload_results_s3
              --triggering_env ${{ inputs.triggering_env }}
              --allowed-envs ${{ inputs.allowed_envs }}
              --allowed-setups ${{ inputs.allowed_setups }}
              --push_results_redistimeseries
              --redistimeseries_host ${{ secrets.PERFORMANCE_RTS_HOST }}
              --redistimeseries_port ${{ secrets.PERFORMANCE_RTS_PORT }}
              --redistimeseries_pass '${{ secrets.PERFORMANCE_RTS_AUTH }}'
              2>&1 | tee run-remote.log

      # Kept so a baseline bump can be proposed off a run's own numbers
      # (tests/benchmarks/update_kpis.py) without re-running the benchmarks.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # triggering_env distinguishes the profiler matrix, which reuses the
          # same member ids in the same workflow run -- upload-artifact@v6
          # requires unique names.
          name: benchmark-results-${{ inputs.triggering_env }}-${{ inputs.benchmark_runner_group_member_id }}
          path: tests/benchmarks/*.json
          if-no-files-found: ignore
          retention-days: 30

      # run-remote's own floor check is left advisory above so that this one
      # can name what went wrong -- a floor breach and a benchmark that never
      # ran are different findings, and only the first is a ticket about
      # RedisJSON. Every breach fails the job; the floors are not touched.
      - name: Check KPI floors
        if: always()
        working-directory: tests/benchmarks
        # --run-log: with run-remote continuing on error, a benchmark it could
        # not run would otherwise leave no trace -- its result file is simply
        # absent, which is indistinguishable from a benchmark this shard was
        # never given. --known-broken exempts json_nummultby_num_2 and nothing
        # else, so any *other* benchmark failing to run still fails the job.
        run: |
          mkdir -p kpi-state
          python3 check_kpis.py --findings-out kpi-state/findings.json \
            --run-log run-remote.log --known-broken json_nummultby_num_2

      # Uploaded even when the step above fails -- especially then: this is what
      # the nightly analysis files the tickets from.
      - name: Upload KPI findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-kpi-findings-${{ inputs.triggering_env }}-${{ inputs.benchmark_runner_group_member_id }}
          path: tests/benchmarks/kpi-state/findings.json
          if-no-files-found: ignore
          retention-days: 30

      # always(): a KPI floor breach fails an earlier step, and a bare
      # `github.event.number` is implicitly `success() && ...`, which would drop
      # the comparison comment exactly on the runs that need it.
      - name: Generate Pull Request Performance info
        if: always() && github.event.number
        continue-on-error: true
        env:
          PERFORMANCE_GH_TOKEN: ${{ secrets.PERFORMANCE_GH_TOKEN }}
          PERFORMANCE_WH_TOKEN: ${{ secrets.PERFORMANCE_WH_TOKEN }}
        run: redisbench-admin compare
              --defaults_filename ./tests/benchmarks/defaults.yml
              --comparison-branch ${{ github.head_ref || github.ref_name }}
              --auto-approve
              --pull-request ${{ github.event.number }}
              --redistimeseries_host ${{ secrets.PERFORMANCE_RTS_HOST }}
              --redistimeseries_port ${{ secrets.PERFORMANCE_RTS_PORT }}
              --redistimeseries_pass '${{ secrets.PERFORMANCE_RTS_AUTH }}'
