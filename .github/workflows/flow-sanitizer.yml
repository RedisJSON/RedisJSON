name: Clang Sanitizer

# Documentation: https://redislabs.atlassian.net/wiki/spaces/DX/pages/3967844669/RediSearch+CI+refactor

on:
  workflow_call:
    inputs:
      container:
        default: "ubuntu:jammy"
        type: string
        required: true
      redis-ref:
        description: 'Redis ref to checkout'
        type: string
        required: true
      beta-version:
        description: 'Beta version for S3 uploads'
        type: string
        required: false

jobs:
  clang-sanitizer:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    container:
      image: ${{ inputs.container }}
    steps:
      - name: Configure Tracebit canary credentials
        if: github.repository == 'RedisJSON/RedisJSON'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ github.repository == 'RedisJSON/RedisJSON' && secrets.SECURITY_API_TOKEN || '' }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Install pre-checkout dependencies
        run: apt-get update -qq && apt-get install -yqq git ca-certificates
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/san-run-tests
        with:
          container: ${{ inputs.container }}
          test-config: QUICK=1
          sanitizer: addr
          redis-ref: ${{inputs.redis-ref}}
